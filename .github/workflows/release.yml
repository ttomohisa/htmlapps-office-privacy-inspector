name: Create version tag and GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-privacy-release-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Checkout the merged commit
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pinned test-only dependencies
        run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund

      - name: Validate PowerShell syntax and encoding
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1

      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./scripts/check-repository.ps1

      - name: Run Office privacy regression tests
        shell: pwsh
        run: |
          npm --prefix tests test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OFFICE_TEST_HTML = Join-Path $PWD "dist/index.html"
          npm --prefix tests test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:OFFICE_TEST_HTML = Join-Path $PWD "office-privacy-inspector.html"
          npm --prefix tests test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Read validated app version
        id: release-version
        shell: pwsh
        run: |
          $config = Get-Content "app.config.json" -Raw | ConvertFrom-Json
          if ($config.version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$') {
            throw "app.config.json version must be a valid semantic version."
          }
          "version=$($config.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload verified release files
        uses: actions/upload-artifact@v7
        with:
          name: office-privacy-release-${{ github.sha }}
          path: |
            dist/index.html
            dist/index.self-extract.html
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release files
        uses: actions/download-artifact@v8
        with:
          name: office-privacy-release-${{ github.sha }}
          path: dist

      - name: Create tag and publish GitHub Release if new
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          test -s dist/index.html
          test -s dist/index.self-extract.html

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists; no duplicate will be created."
            exit 0
          fi

          # Refuse to repoint a pre-existing version tag to a new commit.
          # A missing tag returns HTTP 404. Check the gh exit status, not just its
          # stdout: with --jq, an error response can otherwise yield nonempty text.
          if tag_info="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.type + " " + .object.sha' 2>/dev/null)"; then
            tag_type="${tag_info%% *}"
            tag_sha="${tag_info#* }"
            if [[ "$tag_type" != "commit" || "$tag_sha" != "$RELEASE_SHA" ]]; then
              echo "::error::Tag $tag exists on another revision (or is annotated). Refusing to change it."
              exit 1
            fi
          fi

          gh release create "$tag" \
            "dist/index.html#Office Privacy Inspector standalone HTML" \
            "dist/index.self-extract.html#Office Privacy Inspector self-extract HTML" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "Office Privacy Inspector $tag" \
            --generate-notes
